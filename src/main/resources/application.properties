spring.application.name=job-tracker

# Where the pantry is
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker
spring.datasource.username=jobtracker_user

# The password lives in a private file that never goes to GitHub
spring.config.import=optional:file:./local.properties

# Let Hibernate build the shelves from our Java classes (fine for learning)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.expiration-minutes=60
